<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Biblioteca Retro</title>
    <style>
        body { font-family: sans-serif; background: #222; color: white; text-align: center; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .btn { padding: 20px; background: #e74c3c; border: none; color: white; cursor: pointer; border-radius: 8px; font-weight: bold; }
        #game { width: 100%; height: 80vh; margin-top: 20px; display: none; }
    </style>
</head>
<body>
    <h1>Escolha o Jogo</h1>
    <div class="grid" id="menu">
        <!-- Adicione um botão para cada jogo aqui -->
        <button class="btn" onclick="loadGame('https://play.emulatorjs.com/stable/roms/snes/SuperMarioWorld.sfc', 'snes')">Mario World</button>
        <button class="btn" onclick="loadGame('LINK_DA_ROM_DO_JOGO_2.sfc', 'snes')">Outro Jogo</button>
    </div>

    <div id="game"></div>

    <script src="https://play.emulatorjs.com/stable/data/loader.js"></script>
    <script>
        function loadGame(romUrl, core) {
            document.getElementById('menu').style.display = 'none';
            window.EJS_player = "#game";
            window.EJS_gameUrl = romUrl;
            window.EJS_core = core;
            window.EJS_pathtodata = "https://play.emulatorjs.com/stable/";
            document.getElementById('game').style.display = 'block';
            new EJS({player: "#game", gameUrl: romUrl, core: core, pathtodata: "https://play.emulatorjs.com/stable/"});
        }
    </script>
</body>
</html>
