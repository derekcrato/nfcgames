<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>NFC Arcade</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100vw; height: 100vh;
            background: #000; color: #fff;
            overflow: hidden; font-family: Arial, sans-serif;
        }
        #game { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        #start-btn {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 40px; font-size: 1.2rem; color: #00ffcc;
            background: rgba(0, 255, 204, 0.1); border: 2px solid #00ffcc;
            border-radius: 10px; cursor: pointer; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="game"></div>
    <button id="start-btn">JOGAR</button>
    <script>
        const btn = document.getElementById('start-btn');
        const gameDiv = document.getElementById('game');
        const urlParams = new URLSearchParams(window.location.search);
        const gameKey = urlParams.get('rom') || urlParams.get('game') || 'supermarioworld';

        const GAMES = {
            "supermarioworld": {
                url: "https://raw.githubusercontent.com/derekcrato/nfcgames/main/Super%20Mario%20World%20(USA).sfc",
                system: "snes9x"
            },
            "zelda3": {
                url: "https://raw.githubusercontent.com/derekcrato/nfcgames/main/The%20Legend%20of%20Zelda%20-%20A%20Link%20to%20the%20Past%20(USA).sfc",
                system: "snes9x"
            },
            "chronotrigger": {
                url: "https://raw.githubusercontent.com/derekcrato/nfcgames/main/Chrono%20Trigger%20(USA).sfc",
                system: "snes9x"
            },
            "bomberman5": {
                url: "https://raw.githubusercontent.com/derekcrato/nfcgames/main/Super%20Bomberman%205.sfc",
                system: "snes9x"
            },
            "supermariobors3": {
                url: "https://raw.githubusercontent.com/derekcrato/nfcgames/main/Super%20Mario%20Bros.%203%20(USA).nes",
                system: "fceumm"
            },
            "pokemonred": {
                url: "https://raw.githubusercontent.com/derekcrato/nfcgames/main/Pokemon%20-%20Red%20Version.gbc",
                system: "gambatte"
            },
            "pokemonblue": {
                url: "https://raw.githubusercontent.com/derekcrato/nfcgames/main/Pokemon%20-%20Blue%20Version.gb",
                system: "gambatte"
            },
            "pokemonyellow": {
                url: "https://raw.githubusercontent.com/derekcrato/nfcgames/main/Pokemon%20-%20Yellow%20Version.gbc",
                system: "gambatte"
            },
            "pokemonfirered": {
                url: "https://raw.githubusercontent.com/derekcrato/nfcgames/main/Pokemon%20-%20FireRed.gba",
                system: "mgba"
            },
            "sapoxule": {
                url: "https://raw.githubusercontent.com/derekcrato/nfcgames/main/Sapo%20Xule%20vs.%20Os%20Invasores%20do%20Brejo.bin",
                system: "smsplus"
            },
            "michaeljacksonmd": {
                url: "https://raw.githubusercontent.com/derekcrato/nfcgames/main/Michael%20Jackson's%20Moonwalker%20(World).md",
                system: "genesis_plus_gx"
            }
        };

        function enterFullscreen(el) {
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        }

        btn.addEventListener('click', function() {
            enterFullscreen(document.documentElement);
            btn.style.display = 'none';

            const gameData = GAMES[gameKey];
            if (!gameData) {
                alert('Jogo nao encontrado: ' + gameKey);
                return;
            }

            gameDiv.innerHTML = '<p style="color:#00ffcc;text-align:center;padding:20px;">Carregando...</p>';

            window.EJS_player = '#game';
            window.EJS_core = gameData.system || 'snes9x';
            window.EJS_gameUrl = gameData.url;
            window.EJS_gameName = gameKey;
            window.EJS_startOnLoaded = true;
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            window.EJS_color = '#000000';

            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            script.onerror = function() {
                gameDiv.innerHTML = '<p style="color:red;text-align:center;padding:20px;">Erro ao carregar emulador</p>';
                btn.style.display = 'block';
            };
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
