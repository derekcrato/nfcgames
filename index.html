<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Player SNES</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game"></div>

    <script>
        // Configurações oficiais do EmulatorJS
        EJS_player = "#game";
        // Insira abaixo o link direto para o arquivo da ROM (.sfc ou .smc) hospedado publicamente
        EJS_gameUrl = "https://github.com/derekcrato/nfcgames/blob/main/Super%20Mario%20World%20(USA).sfc";
        EJS_core = "snes";
        EJS_pathtodata = "https://play.emulatorjs.com/stable/";
        EJS_startOnLoaded = true;
    </script>
    <script src="https://play.emulatorjs.com/stable/loader.js"></script>
</body>
</html>
