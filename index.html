<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal SNES NFC</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            overflow: hidden;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
        }
        .error-msg {
            text-align: center;
            padding: 20px;
        }
        code {
            background-color: #222;
            padding: 4px 8px;
            border-radius: 4px;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="display"></div>
    </div>

    <script>
        // Mapeamento dos Jogos gerado automaticamente via Manager Tool
        const ROMS = {
            "bomberman5": "https://raw.githubusercontent.com/derekcrato/nfcgames/main/Super%20Bomberman%205.sfc",
            "supermarioworld": "https://raw.githubusercontent.com/derekcrato/nfcgames/main/Super%20Mario%20World%20(USA).sfc"
};

        // Captura o parâmetro "?rom=" da URL atual
        const urlParams = new URLSearchParams(window.location.search);
        const romKey = urlParams.get('rom');

        const display = document.getElementById('display');

        if (romKey && ROMS[romKey]) {
            const rawRomUrl = ROMS[romKey];

            // Configuradores do EmulatorJS
            EJS_player = '#display';
            EJS_core = 'snes';
            EJS_gameName = romKey;
            EJS_color = '#6b5b95';
            EJS_startOnLoaded = true;
            EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            EJS_gameUrl = rawRomUrl;

            // Carrega a engine do emulador
            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.body.appendChild(script);
        } else {
            display.innerHTML = `
                <div class="error-msg">
                    <h2>Nenhum jogo selecionado!</h2>
                    <p>Use um link válido na sua tag NFC, por exemplo:</p>
                    <p><code>https://derekcrato.github.io/nfcgames/?rom=mario</code></p>
                </div>
            `;
        }
    </script>
</body>
</html>
