<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFC Arcade Portal</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        #display {
            width: 100%;
            height: 100%;
        }
        .error-msg {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        code {
            background-color: #222;
            padding: 6px 12px;
            border-radius: 4px;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="display"></div>
    </div>

    <script>
        const ROMS = {
            "bomberman5": {
                        "url": "https://raw.githubusercontent.com/derekcrato/nfcgames/main/Super%20Bomberman%205.sfc",
                        "system": "snes"
            },
            "supermarioworld": {
                        "url": "https://raw.githubusercontent.com/derekcrato/nfcgames/main/Super%20Mario%20World%20(USA).sfc",
                        "system": "snes"
            }
};

        const urlParams = new URLSearchParams(window.location.search);
        const romKey = urlParams.get('rom');
        const display = document.getElementById('display');

        if (romKey && ROMS[romKey]) {
            const gameData = ROMS[romKey];
            const rawRomUrl = gameData.url;
            const systemCore = gameData.system || 'snes';
            
            const cleanUrl = encodeURI(rawRomUrl);
            const safeRomUrl = 'https://corsproxy.io/?' + encodeURIComponent(cleanUrl);

            // Configuração do EmulatorJS para inicialização automática e sem UI extra
            EJS_player = '#display';
            EJS_core = systemCore;
            EJS_gameName = romKey;
            EJS_color = '#000000';
            EJS_startOnLoaded = true;
            EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            EJS_gameUrl = safeRomUrl;
            EJS_fullscreenOnLoad = true;

            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            
            script.onload = () => {
                // Tenta simular clique e destravar o contexto de áudio do navegador automaticamente
                const autoStartInterval = setInterval(() => {
                    const startBtn = document.querySelector('.ejs_start_button') || document.querySelector('#display canvas');
                    if (startBtn) {
                        startBtn.click();
                        clearInterval(autoStartInterval);
                    }
                }, 200);
            };

            document.body.appendChild(script);
        } else {
            display.innerHTML = `
                <div class="error-msg">
                    <h2>Nenhum jogo selecionado!</h2>
                    <p>Aproxime uma Tag NFC cadastrada no portal.</p>
                </div>
            `;
        }
    </script>
</body>
</html>
