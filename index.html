<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <meta name="application-name" content="NFC Arcade">
    <title>NFC Arcade Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #display {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .pulse-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ffcc;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
            100% { opacity: 0.3; transform: scale(0.98); }
        }
        .error-msg {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <div class="pulse-text">TOQUE PARA JOGAR</div>
    </div>

    <div id="display"></div>

    <script>
        const ROMS = {
            "pokemonblue": {
                        "url": "https://raw.githubusercontent.com/derekcrato/nfcgames/main/Pokemon%20-%20Blue%20Version.gb",
                        "system": "gbc"
            },
            "pokemonred": {
                        "url": "https://raw.githubusercontent.com/derekcrato/nfcgames/main/Pokemon%20-%20Red%20Version.gb",
                        "system": "gbc"
            },
            "pokemonyellow": {
                        "url": "https://raw.githubusercontent.com/derekcrato/nfcgames/main/Pokemon%20-%20Yellow%20Version.gbc",
                        "system": "gbc"
            },
            "bomberman5": {
                        "url": "https://raw.githubusercontent.com/derekcrato/nfcgames/main/Super%20Bomberman%205.sfc",
                        "system": "snes"
            },
            "supermarioworld": {
                        "url": "https://raw.githubusercontent.com/derekcrato/nfcgames/main/Super%20Mario%20World%20(USA).sfc",
                        "system": "snes"
            }
};

        function getSanitizedRomKey() {
            const urlParams = new URLSearchParams(window.location.search);
            const rawKey = urlParams.get('rom');
            if (!rawKey) return null;
            
            const cleanKey = rawKey.toLowerCase().replace(/[^a-z0-9]/g, '');
            
            if (ROMS[cleanKey]) return cleanKey;
            
            for (let key in ROMS) {
                if (key.toLowerCase() === rawKey.toLowerCase()) {
                    return key;
                }
            }
            return null;
        }

        const romKey = getSanitizedRomKey();
        const overlay = document.getElementById('start-overlay');
        const display = document.getElementById('display');

        function requestFS() {
            const el = document.documentElement;
            if (el.requestFullscreen) return el.requestFullscreen();
            if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
            if (el.msRequestFullscreen) return el.msRequestFullscreen();
            return Promise.resolve();
        }

        function lockLandscape() {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        }

        async function startTrigger() {
            try {
                await requestFS();
            } catch (e) {}
            
            lockLandscape();
            overlay.style.display = 'none';

            window.EJS_player = '#display';
            window.EJS_core = systemCore;
            window.EJS_gameName = romKey;
            window.EJS_color = '#000000';
            window.EJS_startOnLoaded = true;
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            window.EJS_gameUrl = directRomUrl;
            
            window.EJS_buttons = {
                play: true,
                pause: true,
                restart: true,
                mute: true,
                settings: true,
                fullscreen: true,
                saveState: true,
                loadState: true,
                screenRecord: false
            };

            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.body.appendChild(script);
        }

        if (romKey && ROMS[romKey]) {
            const gameData = ROMS[romKey];
            const directRomUrl = gameData.url;
            const systemCore = gameData.system || 'snes';

            overlay.addEventListener('click', startTrigger, { once: true });
            overlay.addEventListener('touchstart', startTrigger, { once: true });

            setTimeout(() => {
                if (overlay.style.display !== 'none') {
                    const evt = new MouseEvent('click', {
                        bubbles: true,
                        cancelable: true,
                        view: window
                    });
                    overlay.dispatchEvent(evt);
                }
            }, 1000);

        } else {
            overlay.style.display = 'none';
            display.innerHTML = `
                <div class="error-msg">
                    <h2>Nenhum jogo selecionado!</h2>
                    <p>Aproxime uma Tag NFC cadastrada no portal.</p>
                </div>
            `;
        }
    </script>
</body>
</html>
