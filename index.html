<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Game</title>
</head>
<body style="margin:0; background:#000;">
    <div id="game" style="width:100vw; height:100vh;"></div>
    <script src="https://play.emulatorjs.com/stable/loader.js"></script>
    <script>
        // O EJS precisa ser chamado após o carregamento do script
        window.onload = function() {
            new EJS({
                player: "#game",
                gameUrl: "https://github.com/derekcrato/nfcgames/blob/main/Super%20Mario%20World%20(USA).sfc",
                core: "snes"
            });
        };
    </script>
</body>
</html>
